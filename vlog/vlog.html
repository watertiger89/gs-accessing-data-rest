<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수범 VLOG 1994</title>
<link rel="stylesheet" href="fonts/jua/index.css">
<link rel="stylesheet" href="fonts/dohyeon/index.css">
<link rel="stylesheet" href="fonts/fontsource-vt323/index.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#000;font-family:'Jua',sans-serif}
  .scene{position:absolute;inset:0;opacity:0}
  .abs{position:absolute}
  /* HUD */
  .hud{position:absolute;font-family:'VT323',monospace;color:#fff;font-size:44px;letter-spacing:2px;
       text-shadow:2px 0 rgba(255,0,60,.7),-2px 0 rgba(0,220,255,.7),0 0 8px rgba(0,0,0,.6);z-index:50}
  #scan{position:absolute;inset:0;z-index:60;pointer-events:none;
        background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
  #vig{position:absolute;inset:0;z-index:61;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
  #noise{position:absolute;inset:0;width:100%;height:100%;z-index:55;image-rendering:pixelated;mix-blend-mode:screen}
  #track{position:absolute;left:0;width:100%;height:46px;z-index:56;
         background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),rgba(255,255,255,.15),transparent);filter:blur(1px)}
  .caption{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#ffe14a;color:#1b1b1b;
           font-family:'Do Hyeon';font-size:46px;padding:10px 30px;border:5px solid #1b1b1b;border-radius:14px;
           box-shadow:8px 8px 0 #1b1b1b;white-space:nowrap;z-index:20}
  .chalk{font-family:'Jua';color:#f3f6ee;text-shadow:0 0 2px rgba(255,255,255,.6);white-space:nowrap}
  .card{position:absolute;width:250px;height:190px;border:5px solid #1b1b1b;border-radius:22px;box-shadow:9px 9px 0 #1b1b1b;
        display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Do Hyeon';font-size:38px;color:#1b1b1b}
  .card svg{width:110px;height:90px}
</style>
</head>

      <svg viewBox="0 0 110 90"><rect x="10" y="18" width="90" height="56" rx="6" fill="#2a2a2a" stroke="#1b1b1b" stroke-width="5"/><rect x="22" y="28" width="66" height="22" fill="#ffd23f"/><circle cx="38" cy="39" r="7" fill="#2a2a2a"/><circle cx="72" cy="39" r="7" fill="#2a2a2a"/></svg>가요톱텐 녹음</div>

        <svg class="abs" style="left:30px;top:120px" width="320" height="240" viewBox="0 0 320 240">

          <rect x="120" y="30" width="80" height="210" fill="#efd6a6" stroke="#1b1b1b" stroke-width="5"/>

        </svg>

          <path d="M-12 54 Q0 68 12 54" stroke="#1b1b1b" stroke-width="4" fill="#fff"/>

      <div class="abs" style="left:0;width:100%;top:400px;text-align:center;font-family:'Jua';font-size:44px;color:#2a2a8a">'94 봄, 수범</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const easeOut = x=>1-Math.pow(1-x,3);
const easeIn = x=>x*x*x;
const back = x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic = x=> x===0||x===1?x:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1;
let seed=1; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const nctx=$('noise').getContext('2d'); const img=nctx.createImageData(320,180);

function noise(amount,f){
  seed = 1000+f*7919;
  const d=img.data;
  for(let i=0;i<d.length;i+=4){const v=rnd()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=v*amount;}
  nctx.putImageData(img,0,0);
}
function show(id,o){$(id).style.opacity=o}
function tf(id,s){$(id).style.transform=s}

const cuts=[2,4,6,8];
function render(t){
  const f=Math.round(t*30);
  // scene visibility (hard cuts, glitch hides seams)
  ['s0','s1','s2','s3','s4'].forEach((s,i)=>show(s, (t>=[0,2,4,6,8][i] && t<[2,4,6,8,99][i])?1:0));

  // glitch intensity around cuts
  let g=0; cuts.forEach(c=>{g=Math.max(g,1-Math.abs(t-c)/0.18)}); g=clamp(g);
  let n = 0.06 + g*0.75;
  if(t<0.55) n = 1;                         // opening static
  noise(n,f);
  const jx = g>0? (rnd()-.5)*40*g : 0;
  $('stage').style.filter = `saturate(1.15) contrast(1.05) hue-rotate(${g*30}deg)`;
  ['s0','s1','s2','s3','s4'].forEach(s=>tf(s,`translateX(${jx}px) skewX(${g*(rnd()-.5)*12}deg)`));
  $('track').style.top = ((t*260)%900 - 120)+'px';
  $('track').style.opacity = 0.35 + g*0.6;

  // HUD
  $('dot').style.opacity = (Math.floor(t*2)%2===0)?1:0;
  const sec=Math.floor(t), fr=f%30;
  $('cnt').textContent = `0:00:${String(sec).padStart(2,'0')}.${String(fr).padStart(2,'0')}`;
  const clock = [[8,12],[8,20],[10,45],[15,30],[18,5]][Math.min(4,Math.floor(t/2))];
  const ss = String(Math.floor((t%2)*7)).padStart(2,'0');
  $('date').innerHTML = `${clock[0]<12?'AM':'PM'} ${String(clock[0]>12?clock[0]-12:clock[0]).padStart(2,'0')}:${String(clock[1]).padStart(2,'0')}:${ss}<br>MAR. 2 1994`;
  const hudOn = t>0.55;
  ['rec','sp','cnt','date'].forEach(h=>show(h, hudOn && t<9.4 ?1:0));

  // ---- S0
  show('play', t>0.55 && t<1.05 && (Math.floor(t*6)%2===0) ? 1 : (t>0.55&&t<1.05?0.6:0));
  const ti = seg(t,1.0,1.15); show('title', ti>0?1:0);
  tf('dots',`translate(${(t*40)%90}px,${(t*40)%90}px)`);
  const a1=seg(t,1.05,1.4), a2=seg(t,1.2,1.65), a3=seg(t,1.45,1.85);
  tf('t1',`translateY(${(1-easeOut(a1))*-200}px)`); show('t1',a1>0?1:0);
  tf('t2',`scale(${a2>0?back(a2):0}) rotate(${(1-a2)*-8}deg)`);
  tf('t3',`scale(${a3>0?elastic(a3):0}) rotate(${-12+Math.sin(t*6)*6}deg)`);

  // ---- S1
  const u=seg(t,2,4);
  tf('sun',`rotate(${t*40}deg)`);
  $('cloud1').style.left = (100+u*120)+'px'; $('cloud2').style.left=(650-u*90)+'px';
  tf('school',`scale(${1.06-u*0.06})`); $('school').style.transformOrigin='center bottom';
  tf('flag',`skewY(${Math.sin(t*14)*8}deg)`); $('flag').style.transformOrigin='740px 20px';
  $('kid').style.left = (-160 + easeOut(u)*640)+'px';
  const step=Math.sin(t*22);
  tf('kid',`translateY(${Math.abs(step)*-10}px) rotate(${step*2}deg)`);
  $('legL').setAttribute('transform',`rotate(${step*22} -12 150)`);
  $('legR').setAttribute('transform',`rotate(${-step*22} 12 150)`);
  const c1=seg(t,2.35,2.7);
  tf('c1',`translateX(-50%) translateY(${(1-back(c1))*220}px)`);

  // ---- S2 chalk reveals
  [['b1',4.1,4.45],['b2',4.35,4.85],['b3',4.8,5.1],['b4',5.05,5.4]].forEach(([id,a,b])=>{
    const p=seg(t,a,b); $(id).style.clipPath=`inset(0 ${100-p*100}% 0 0)`;
  });
  const sp=seg(t,5.05,5.3);
  const shake = (t>5.3&&t<5.5)? Math.sin(t*120)*6*(1-seg(t,5.3,5.5)):0;
  show('stamp', sp>0?1:0);
  tf('stamp',`scale(${sp>0? 1+ (1-easeIn(sp))*2.2 : 0}) rotate(${-14}deg)`);
  tf('s2',`translateX(${jx+shake}px) translateY(${shake*.6}px)`);
  const c2=seg(t,5.3,5.6); tf('c2',`translateX(-50%) translateY(${(1-back(c2))*220}px)`);

  // ---- S3
  tf('burst',`rotate(${t*25}deg)`);
  const st=seg(t,6.0,6.3); tf('s3title',`scale(${st>0?back(st):0})`);
  for(let i=0;i<6;i++){
    const p=seg(t,6.15+i*0.13,6.55+i*0.13);
    const wob=Math.sin(t*8+i)*4;
    tf('k'+i,`scale(${p>0?elastic(p):0}) rotate(${(i%2?1:-1)*(3+ (1-p)*25)+wob}deg)`);
  }

  // ---- S4
  const pd=seg(t,8.0,8.5);
  tf('polaroid',`translateY(${(1-easeOut(pd))*-700}px) rotate(${-6+(1-pd)*-20}deg)`);
  const o1=seg(t,8.4,8.75), o2=seg(t,8.7,9.05), o3=seg(t,9.0,9.3);
  show('o1',o1); tf('o1',`translateX(${(1-easeOut(o1))*60}px)`);
  tf('o2',`scale(${o2>0?back(o2):0})`); $('o2').style.transformOrigin='left center';
  show('o3',o3);

  // STOP + rewind tail
  const so = t>9.4 && t<9.85 ? 1:0;
  show('stop',so);
  const rw=seg(t,9.4,9.85);
  if(t>9.4){ noise(0.15+rw*0.6,f); tf('s4',`translateY(${Math.sin(f*1.7)*rw*14}px) skewX(${rw*-8}deg)`); }
  show('black', seg(t,9.8,10.0));
}
window.render=render;
render(0);
</script>
</body>
</html>
